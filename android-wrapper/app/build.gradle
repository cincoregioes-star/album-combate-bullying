plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.combatebullying.album'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.combatebullying.album'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
